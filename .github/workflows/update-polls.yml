name: Refresh poll benchmarks (weekly)

on:
  schedule:
    - cron: "47 5 * * 0"   # Sundays 05:47 UTC, before the daily market run
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite")'

      - name: Fetch RCP averages
        run: Rscript pipeline/update_polls.R

      - name: Rebuild data.json with the new benchmarks
        run: Rscript pipeline/update_data.R

      - name: Archive the individual polls behind the RCP averages
        run: Rscript pipeline/archive_polls.R

      - name: Commit
        run: |
          git config user.name "pollsvscash-bot"
          git config user.email "actions@github.com"
          git add pipeline/polls.csv docs/data.json pipeline/polls_raw
          git diff --cached --quiet || git commit -m "Weekly poll benchmark refresh $(date -u +%F)"
          git push
