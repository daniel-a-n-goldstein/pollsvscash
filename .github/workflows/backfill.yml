name: Backfill market history (manual, one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite")'
      - name: Refresh poll benchmarks (so new races have one)
        run: Rscript pipeline/update_polls.R
      - name: Today's market snapshot (so new races exist in data.json)
        run: Rscript pipeline/update_data.R
      - name: Backfill market history
        run: Rscript pipeline/backfill_markets.R
      - name: Estimate pre-launch poll line from individual polls
        run: Rscript pipeline/backfill_polls.R
      - name: Commit
        run: |
          git config user.name "pollsvscash-bot"
          git config user.email "actions@github.com"
          git add pipeline/polls.csv docs/data.json
          git diff --cached --quiet || git commit -m "Backfill pre-launch market and poll history"
          git push
