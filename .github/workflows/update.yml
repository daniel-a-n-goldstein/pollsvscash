name: Update Polls vs. Cash data

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC (off the :00/:30 marks GitHub drops under load)
    - cron: "17 13 * * *"  # backstop later in the day; the script replaces same-day points, so this is harmless
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite")'

      - name: Run pipeline
        run: Rscript pipeline/update_data.R

      - name: Commit updated data
        run: |
          git config user.name "pollsvscash-bot"
          git config user.email "actions@github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Daily data update $(date -u +%F)"
          git push
