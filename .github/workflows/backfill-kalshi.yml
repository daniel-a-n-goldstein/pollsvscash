name: Backfill Kalshi history (manual, one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite")'
      - name: Today's snapshot (adds today's Kalshi price)
        run: Rscript pipeline/update_data.R
      - name: Backfill Kalshi history onto existing rows
        run: Rscript pipeline/backfill_kalshi.R
      - name: Commit
        run: |
          git config user.name "pollsvscash-bot"
          git config user.email "actions@github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Backfill Kalshi market history"
          git push
